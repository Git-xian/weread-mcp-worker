# 微信读书远程 MCP · VPS 一键部署（Docker Compose + Caddy 自动 HTTPS）
#
# 用法：
#   1) cp .env.example .env  并填好（域名 / key / 口令）
#   2) docker compose up -d --build
#   3) 手机端填 https://<你的域名>/mcp

name: weread-mcp

services:
  app:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      # 共读数据落点：看板上拖入 EPUB 会写到这里（宿主机 ./data/coread.json 持久化）
      COREAD_FILE: ${COREAD_FILE:-/data/coread.json}
    volumes:
      # 共读数据（可选）：看板导入的原书会保存在这，重建容器不丢
      - ./data:/data
    expose:
      - "8787"
    networks: [weread]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [weread]

networks:
  weread:

volumes:
  caddy_data:
  caddy_config:
